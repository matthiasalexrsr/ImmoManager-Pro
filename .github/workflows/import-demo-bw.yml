# Bound to the reviewed snapshot below. Upload this workflow LAST.
name: Import reviewed desktop and BW demo snapshot

on:
  push:
    branches: ['transfer/demo-bw-2026-11-05']
    paths: ['.github/workflows/import-demo-bw.yml']

permissions: {}
concurrency:
  group: import-demo-bw-2-0-0-beta-1
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'matthiasalexrsr/ImmoManager-Pro' &&
      github.ref == 'refs/heads/transfer/demo-bw-2026-11-05' &&
      github.actor == 'matthiasalexrsr' &&
      github.triggering_actor == 'matthiasalexrsr' &&
      github.run_attempt == 1 && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BASE_COMMIT: '7283127210254550359c9951d0fbfbf0866f5d09'
      EXPECTED_COMMIT: '6ef888c64df418e0b3d5a0ab298f93627e8d34aa'
      EXPECTED_TREE: '2dd0f3e9ff04860cf03c5517f7b42ba61c2471c5'
      EXPECTED_CI_BLOB: 'b78f599f9c8c88c8c2d0277950c65b7938ab0574'
      EXPECTED_BUNDLE_SHA256: 'bf94f91563f5cb9ef252f7842f16bb9e35a3aee98b09b9631f9f1b4c1906cee0'
      EXPECTED_BUNDLE_BYTES: '277854'
      TARGET_REF: 'refs/heads/codex/demo-bw-2.0.0-beta.1'
      REMOTE_URL: 'https://github.com/matthiasalexrsr/ImmoManager-Pro.git'
      GIT_NO_REPLACE_OBJECTS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Read the owner-created transfer commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4, verified separately
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify bundle and import objects without checking out product code
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git cat-file -t "$BASE_COMMIT")" == commit ]]
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          [[ "$(git rev-parse HEAD:.github/workflows/ci.yml)" == "$EXPECTED_CI_BLOB" ]] || {
            echo '::error::The owner must upload the exact reviewed ci.yml on the transfer branch first.'; exit 1;
          }
          [[ "$(git rev-parse HEAD:.github/workflows/desktop.yml)" == "c71dc6b8a0c79b51767089b6d2a43f75a396050d" ]]
          [[ "$(git rev-parse HEAD:.github/workflows/release.yml)" == "93077f8a790b6036c135e618aec0b436519ae3b7" ]]
          [[ "$(git rev-parse HEAD:.github/workflows/testversion.yml)" == "8523308b8b1a900f1f0dd922c67bed430bd28a92" ]]
          [[ -f demo-bw.bundle && ! -L demo-bw.bundle ]]
          [[ "$(stat -c %s demo-bw.bundle)" == "$EXPECTED_BUNDLE_BYTES" ]]
          printf '%s  demo-bw.bundle\n' "$EXPECTED_BUNDLE_SHA256" | sha256sum --check --strict -
          git bundle verify demo-bw.bundle
          [[ "$(git bundle list-heads demo-bw.bundle)" == "$EXPECTED_COMMIT $TARGET_REF" ]]
          git -c core.hooksPath=/dev/null fetch --no-tags ./demo-bw.bundle "$TARGET_REF:refs/import/demo-bw"
          [[ "$(git rev-parse refs/import/demo-bw^{commit})" == "$EXPECTED_COMMIT" ]]
          [[ "$(git rev-parse refs/import/demo-bw^{tree})" == "$EXPECTED_TREE" ]]
          git merge-base --is-ancestor "$BASE_COMMIT" "$EXPECTED_COMMIT"
          [[ "$(git rev-parse "$EXPECTED_COMMIT:.github/workflows/ci.yml")" == "$EXPECTED_CI_BLOB" ]]
          workflow_delta=$(git -c core.hooksPath=/dev/null diff --no-ext-diff --name-only "$BASE_COMMIT" "$EXPECTED_COMMIT" -- .github/workflows)
          [[ "$(git rev-parse "$EXPECTED_COMMIT:.github/workflows/desktop.yml")" == "c71dc6b8a0c79b51767089b6d2a43f75a396050d" ]]
          [[ "$(git rev-parse "$EXPECTED_COMMIT:.github/workflows/release.yml")" == "93077f8a790b6036c135e618aec0b436519ae3b7" ]]
          [[ "$(git rev-parse "$EXPECTED_COMMIT:.github/workflows/testversion.yml")" == "8523308b8b1a900f1f0dd922c67bed430bd28a92" ]]
          expected_workflow_delta=$(printf '%s\n' '.github/workflows/desktop.yml' '.github/workflows/release.yml' '.github/workflows/testversion.yml')
          [[ "$workflow_delta" == "$expected_workflow_delta" ]] || {
            echo '::error::Unexpected workflow changes; this importer does not authorize them.'; exit 1;
          }
          [[ -z "$(git ls-tree --name-only "$EXPECTED_COMMIT" -- demo-bw.bundle .github/workflows/import-demo-bw.yml)" ]]
          printf 'Verified commit %s; tree %s. No product code was checked out or executed.\n' "$EXPECTED_COMMIT" "$EXPECTED_TREE"

      - name: Create only the reviewed target ref, or confirm an identical existing ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse refs/import/demo-bw^{commit})" == "$EXPECTED_COMMIT" ]]
          [[ "$(git rev-parse refs/import/demo-bw^{tree})" == "$EXPECTED_TREE" ]]
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          printf '::add-mask::%s\n' "$auth"
          auth_header="AUTHORIZATION: basic $auth"
          printf '::add-mask::%s\n' "$auth_header"
          unset GH_TOKEN auth
          # Configuration exists only in these Git child processes, never in a URL or a config file.
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth_header" \
              git -c credential.helper= "$@"
          }
          set +e
          remote_line=$(git_auth ls-remote --exit-code --refs "$REMOTE_URL" "$TARGET_REF")
          remote_status=$?
          set -e
          if [[ "$remote_status" == 0 ]]; then
            [[ "$remote_line" == "$EXPECTED_COMMIT"$'\t'"$TARGET_REF" ]] || {
              echo '::error::Target ref already exists at an unexpected commit; nothing will be updated.'; exit 1;
            }
            echo 'Target already contains the exact reviewed commit. No push is necessary.'
            exit 0
          fi
          [[ "$remote_status" == 2 && -z "$remote_line" ]] || {
            echo '::error::Remote lookup failed; an authentication/network error is not an absent ref.'; exit 1;
          }
          hooks=$(mktemp -d "$RUNNER_TEMP/audit-import-hooks.XXXXXXXX")
          # This own, inline guard checks the advertisement used by the actual push.
          # It rejects a racing existing ref even if a normal fast-forward would be possible.
          cat > "$hooks/pre-push" <<'HOOK'
          #!/usr/bin/env bash
          set -euo pipefail
          updates=0
          while read -r local_ref local_oid remote_ref remote_oid; do
            updates=$((updates + 1))
            [[ "$updates" == 1 && "$local_oid" == "$EXPECTED_COMMIT" && "$remote_ref" == "$TARGET_REF" \
               && "$remote_oid" == 0000000000000000000000000000000000000000 ]] || {
              echo 'Rejected: only creation of the exact reviewed target is permitted.' >&2; exit 1;
            }
          done
          # Zero updates is safe: another actor may already have pushed the identical commit.
          HOOK
          chmod 700 "$hooks/pre-push"
          git_auth -c core.hooksPath="$hooks" -c push.followTags=false -c push.recurseSubmodules=no \
            push --porcelain --no-follow-tags --recurse-submodules=no "$REMOTE_URL" "$EXPECTED_COMMIT:$TARGET_REF"
          [[ "$(git_auth ls-remote --exit-code --refs "$REMOTE_URL" "$TARGET_REF")" == "$EXPECTED_COMMIT"$'\t'"$TARGET_REF" ]]
          unset auth_header
          printf 'Confirmed remote %s at %s. No force update or tag was used.\n' "$TARGET_REF" "$EXPECTED_COMMIT"
