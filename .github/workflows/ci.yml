name: CI

on:
  push:
    branches:
      - main
      - claude/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov mypy pip-audit
      - name: Lint (ruff)
        run: ruff check backend
      - name: Type check (mypy)
        run: mypy backend/app.py backend/domain/ --ignore-missing-imports
      - name: Security audit (pip-audit)
        run: pip-audit --strict --desc 2>/dev/null || echo "::warning::pip-audit found vulnerabilities"
      - name: Run tests with coverage
        run: pytest backend/tests -q --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=80
      - name: Import smoke check
        run: python -c "from backend.app import app; print('App imports OK')"

  e2e-smoke:
    name: E2E smoke (docker-compose)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Run E2E smoke checks
        run: bash scripts/e2e_smoke.sh

  deploy-readiness:
    name: Deployment readiness
    runs-on: ubuntu-latest
    needs: [frontend, backend, e2e-smoke]
    if: ${{ always() }}
    steps:
      - name: Gate on pipeline status
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
            echo "Pipeline not deployment-ready"
            exit 1
          fi
          echo "Pipeline deployment-ready"
