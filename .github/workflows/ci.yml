name: CI

on:
  push:
    branches:
      - main
      - claude/**
      - codex/**
      - pro/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  document-tools:
    name: Native document engines and browser workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install pinned local document tools
        run: |
          python -m pip install -r backend/requirements-dev.txt -r requirements-documents-optional.txt -c constraints.txt
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr-deu tesseract-ocr-eng
          python -c "import glob, os; from pathlib import Path; paths=[p for p in glob.glob('/usr/share/tesseract-ocr/*/tessdata') if Path(p,'deu.traineddata').is_file() and Path(p,'eng.traineddata').is_file()]; assert len(paths)==1; print('TESSDATA_PREFIX='+paths[0], file=open(os.environ['GITHUB_ENV'],'a'))"
          npm ci --prefix optional/document-editor
          npm run build --prefix optional/document-editor
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm install --prefix "$RUNNER_TEMP/document-browser" playwright@1.62.1
          "$RUNNER_TEMP/document-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise actual native engines and isolated application
        run: |
          python scripts/run_pro_matrix.py --backend sql --label document-tools backend/tests/test_document_work.py backend/tests/test_document_work_migration.py backend/tests/test_assistant_handoff.py tools/document_pdf_engine_cases.py tools/document_ocr_engine_cases.py
          python scripts/run_document_browser_qa.py --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/document-browser
          python scripts/run_daily_browser_qa.py --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/daily-browser
          python scripts/run_daily_browser_qa.py --suite interfaces --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/interfaces-browser
          python scripts/run_daily_browser_qa.py --suite qol --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/qol-browser
          python scripts/run_daily_browser_qa.py --suite application --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/application-browser
          python scripts/run_daily_browser_qa.py --suite operations --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/operations-browser
          python scripts/run_daily_browser_qa.py --suite office --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/office-browser
          python scripts/run_assistant_browser_qa.py --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/assistant-browser
          python scripts/run_pdf_toolbar_browser_qa.py --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/pdf-toolbar-browser
          python scripts/run_pdf_toolbar_browser_qa.py --suite statement-letter --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/statement-letter-browser
          python scripts/run_pdf_toolbar_browser_qa.py --suite task-cost-workspace --playwright "$RUNNER_TEMP/document-browser/node_modules/playwright/index.mjs" --output artifacts/task-cost-browser
          python -c "import subprocess,sys; from pathlib import Path; files=list(Path('artifacts/document-browser').rglob('native-editor-roundtrip.docx')); assert len(files)==1; p=files[0]; subprocess.run([sys.executable,'scripts/check_document_editor_roundtrip.py',str(p.parents[1]/'fixtures/Langdokument.docx'),str(p)],check=True)"
      - name: Preserve document evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-tools
          path: |
            artifacts/document-browser
            artifacts/daily-browser
            artifacts/interfaces-browser
            artifacts/qol-browser
            artifacts/application-browser
            artifacts/operations-browser
            artifacts/office-browser
            artifacts/assistant-browser
            artifacts/pdf-toolbar-browser
            artifacts/statement-letter-browser
            artifacts/task-cost-browser
            artifacts/pro-tests

  backend:
    name: Backend ${{ matrix.store-backend }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        store-backend: ['memory', 'sql']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-bank.txt -c constraints.txt
          pip install ruff==0.15.20 pytest-cov==7.1.0 mypy==2.4.0 pdfplumber==0.11.10 -c constraints.txt
          # the audit tool stays current on purpose (it judges the pinned set above)
          pip install pip-audit
      - name: Lint (ruff)
        if: matrix.store-backend == 'memory'
        run: ruff check backend
      - name: Type check (mypy)
        if: matrix.store-backend == 'memory'
        run: mypy backend
      - name: Security audit (pip-audit)
        if: matrix.store-backend == 'memory'
        run: pip-audit -r requirements.txt --strict --desc
      - name: Run tests with coverage
        env:
          TEST_STORE_BACKEND: ${{ matrix.store-backend }}
        run: pytest backend/tests -q --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=80
      - name: Import smoke check
        if: matrix.store-backend == 'memory'
        run: python -c "from backend.app import app; print('App imports OK')"

  postgres:
    name: PostgreSQL regression gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: immo_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immo_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IMMO_TEST_POSTGRES_ADMIN_URL: postgresql://immo_test:local-ci-only@127.0.0.1:5432/postgres
      TEST_STORE_BACKEND: memory
      SQLITE_PERSISTENT_STORE: 'false'
      ALLOW_INMEMORY_FALLBACK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies and PostgreSQL tools
        run: |
          python -m pip install -r backend/requirements-dev.txt -r requirements-documents-optional.txt -c constraints.txt
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run all PostgreSQL checks without skips
        run: python scripts/check_postgres.py
      - name: Verify financial calculations on an independent PostgreSQL database
        run: python scripts/run_pro_matrix.py --backend native --native-port 5432 --native-user immo_test --label finance-report-release backend/tests/test_finance_report_boundaries.py backend/tests/test_finance_packages_v2.py
      - name: Verify financial workspaces and invoice payment evidence on PostgreSQL
        run: python scripts/run_pro_matrix.py --backend native --native-port 5432 --native-user immo_test --label financial-workspace-release backend/tests/test_financial_workspaces.py backend/tests/test_billing_workflow.py backend/tests/test_invoice_review.py
      - name: Verify property, unit and document workspaces on PostgreSQL
        run: python scripts/run_pro_matrix.py --backend native --native-port 5432 --native-user immo_test --label estate-workspace-release backend/tests/test_estate_workspaces.py
      - name: Verify private assistant ownership and draft handoff on PostgreSQL
        run: python scripts/run_pro_matrix.py --backend native --native-port 5432 --native-user immo_test --label assistant-release backend/tests/test_assistant_context.py backend/tests/test_assistant_proposals.py backend/tests/test_assistant_workspace.py backend/tests/test_assistant_migration.py backend/tests/test_assistant_tools.py backend/tests/test_assistant_handoff.py backend/tests/test_assistant_findings.py backend/tests/test_assistant_investigation.py
      - name: Verify scoped history traversal on PostgreSQL
        run: python scripts/run_pro_matrix.py --backend native --native-port 5432 --native-user immo_test --label history-release backend/tests/test_history_native.py
      - name: Preserve PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-checks
          path: |
            artifacts/postgres-checks.xml
            artifacts/pro-tests

  e2e-smoke:
    name: E2E smoke (docker-compose)
    runs-on: ubuntu-latest
    needs: [backend, postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run E2E smoke checks
        run: bash scripts/e2e_smoke.sh

  deploy-readiness:
    name: Deployment readiness
    runs-on: ubuntu-latest
    needs: [frontend, document-tools, backend, postgres, e2e-smoke]
    if: ${{ always() }}
    steps:
      - name: Gate on pipeline status
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.document-tools.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.postgres.result }}" != "success" ] || \
             [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
            echo "Pipeline not deployment-ready"
            exit 1
          fi
          echo "Pipeline deployment-ready"
