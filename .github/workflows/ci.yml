name: CI

on:
  push:
    branches:
      - main
      - claude/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend ${{ matrix.store-backend }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        store-backend: ['memory', 'sql']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov mypy pip-audit
      - name: Lint (ruff)
        if: matrix.store-backend == 'memory'
        run: ruff check backend scripts/backup_scheduler.py
      - name: Type check (mypy)
        if: matrix.store-backend == 'memory'
        run: >-
          mypy backend/app.py backend/domain backend/repositories backend/plugins
          backend/auth.py backend/dependencies.py backend/middleware.py backend/static_access.py
          backend/settings.py backend/recovery.py backend/services/full_recovery.py
          backend/services/recovery_archive.py backend/services/recovery_validation.py
          backend/services/data_transfer.py backend/services/payments.py backend/services/payment_integrity.py
          backend/services/rent_ledger.py backend/services/billing_settlement.py backend/services/report_service.py
          backend/routers/billing.py backend/frontend_build.py backend/updater.py backend/maintenance.py
          scripts/backup_scheduler.py --ignore-missing-imports
      - name: Security audit (pip-audit)
        if: matrix.store-backend == 'memory'
        run: pip-audit -r requirements.txt --strict --desc
      - name: Run tests with coverage
        env:
          TEST_STORE_BACKEND: ${{ matrix.store-backend }}
        run: pytest backend/tests -q --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=80
      - name: Import smoke check
        if: matrix.store-backend == 'memory'
        run: python -c "from backend.app import app; print('App imports OK')"

  e2e-smoke:
    name: E2E smoke (docker-compose)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run E2E smoke checks
        run: bash scripts/e2e_smoke.sh

  browser-e2e:
    name: Browser workflows (Chromium + SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Test real browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Test owner setup and two-factor login on an empty installation
        working-directory: frontend
        run: npm run test:e2e -- --fresh-install
      - name: Upload browser report, screenshots, traces and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-readiness:
    name: Deployment readiness
    runs-on: ubuntu-latest
    needs: [frontend, backend, e2e-smoke, browser-e2e]
    if: ${{ always() }}
    steps:
      - name: Gate on pipeline status
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.e2e-smoke.result }}" != "success" ] || \
             [ "${{ needs.browser-e2e.result }}" != "success" ]; then
            echo "Pipeline not deployment-ready"
            exit 1
          fi
          echo "Pipeline deployment-ready"
