name: CI

on:
  push:
    branches:
      - main
      - claude/**
      - codex/**
      - pro/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend ${{ matrix.store-backend }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        store-backend: ['memory', 'sql']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install ruff==0.15.20 pytest-cov==7.1.0 mypy==2.4.0 pdfplumber==0.11.10 -c constraints.txt
          # the audit tool stays current on purpose (it judges the pinned set above)
          pip install pip-audit
      - name: Lint (ruff)
        if: matrix.store-backend == 'memory'
        run: ruff check backend
      - name: Type check (mypy)
        if: matrix.store-backend == 'memory'
        run: mypy backend
      - name: Security audit (pip-audit)
        if: matrix.store-backend == 'memory'
        run: pip-audit -r requirements.txt --strict --desc
      - name: Run tests with coverage
        env:
          TEST_STORE_BACKEND: ${{ matrix.store-backend }}
        run: pytest backend/tests -q --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=80
      - name: Import smoke check
        if: matrix.store-backend == 'memory'
        run: python -c "from backend.app import app; print('App imports OK')"

  postgres:
    name: PostgreSQL regression gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: immo_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immo_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IMMO_TEST_POSTGRES_ADMIN_URL: postgresql://immo_test:local-ci-only@127.0.0.1:5432/postgres
      TEST_STORE_BACKEND: memory
      SQLITE_PERSISTENT_STORE: 'false'
      ALLOW_INMEMORY_FALLBACK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies and PostgreSQL tools
        run: |
          python -m pip install -r backend/requirements-dev.txt -c constraints.txt
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run all PostgreSQL checks without skips
        run: python scripts/check_postgres.py
      - name: Preserve PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-checks
          path: artifacts/postgres-checks.xml

  e2e-smoke:
    name: E2E smoke (docker-compose)
    runs-on: ubuntu-latest
    needs: [backend, postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run E2E smoke checks
        run: bash scripts/e2e_smoke.sh

  deploy-readiness:
    name: Deployment readiness
    runs-on: ubuntu-latest
    needs: [frontend, backend, postgres, e2e-smoke]
    if: ${{ always() }}
    steps:
      - name: Gate on pipeline status
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.postgres.result }}" != "success" ] || \
             [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
            echo "Pipeline not deployment-ready"
            exit 1
          fi
          echo "Pipeline deployment-ready"
