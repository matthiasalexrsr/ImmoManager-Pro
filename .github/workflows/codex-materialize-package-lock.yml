name: Codex Materialize package-lock

on:
  push:
    branches:
      - codex/production-ready-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize frontend package-lock.json
        run: |
          cat \
            .codex/package-lock-fix/part00 \
            .codex/package-lock-fix/part01 \
            .codex/package-lock-fix/part02 \
            .codex/package-lock-fix/part03 \
            .codex/package-lock.json.gz.b64.part2 \
            .codex/package-lock.json.gz.b64.part3 \
            > /tmp/package-lock.json.gz.b64
          base64 -d /tmp/package-lock.json.gz.b64 | gzip -d > frontend/package-lock.json
          test "$(sha256sum frontend/package-lock.json | awk '{print $1}')" = "a5a32359ac3e0cd312286f8410401fd207e1d2a30f83ec4e85b4f8eaee61570b"

      - name: Commit materialized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "Materialize frontend package lock"
            git push
          fi
