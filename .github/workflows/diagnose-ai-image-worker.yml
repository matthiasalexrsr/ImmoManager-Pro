name: Diagnose reviewed final document worker

on:
  push:
    branches: ['transfer/ai-image-worker-diagnostics-2026-11-06']
    paths: ['.github/workflows/diagnose-ai-image-worker.yml']

permissions:
  contents: read

concurrency:
  group: ai-final-document-diagnostics-2026-11-06
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'matthiasalexrsr/ImmoManager-Pro' &&
      github.ref == 'refs/heads/transfer/ai-image-worker-diagnostics-2026-11-06' &&
      github.actor == 'matthiasalexrsr' &&
      github.triggering_actor == 'matthiasalexrsr' &&
      github.run_attempt == 1 && github.event.deleted == false
    name: ${{ matrix.id }} final document diagnosis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-15
            python: '3.11.9'
            arch: arm64
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Read only the exact final source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'ad130a36150747e06fd83085d41709af5e3dca93'
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Select the same native Python patch as the failed job
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: Install the exact reviewed native dependency pins
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == 'ad130a36150747e06fd83085d41709af5e3dca93' ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == 'b084f140b56c8594d3e8e2f037740c969b86596c' ]]
          python -m pip install -r requirements-pip.txt
          python -m pip install -r requirements.txt -r requirements-build.txt -c constraints.txt
          python -m pip check
      - name: Observe only synthetic owned workers without relaxing their limits
        env:
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/ai-document-final-diag-${{ matrix.id }}
        run: |
          python - <<'PY'
          """Observe only synthetic owned document workers at one exact source commit."""
          from __future__ import annotations
          
          import argparse
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import queue
          import subprocess
          import sys
          import time
          import zipfile
          from dataclasses import asdict
          from io import BytesIO
          from pathlib import Path
          
          EXPECTED_COMMIT = "ad130a36150747e06fd83085d41709af5e3dca93"
          EXPECTED_TREE = "b084f140b56c8594d3e8e2f037740c969b86596c"
          CAPTURE_BYTES = 65536
          LIMIT_TRACE = '''
          import json,os,resource,sys
          from backend.services.e_invoice.posix_worker import main
          original_limit=resource.setrlimit
          original_exec=os.execvpe
          names={}
          for name in dir(resource):
              if name.startswith('RLIMIT_'):
                  names.setdefault(getattr(resource,name),[]).append(name)
          def traced_limit(name,values):
              print(json.dumps({'limit_stage':'before','names':names.get(name),
                    'current':resource.getrlimit(name),'proposed':values}),flush=True)
              original_limit(name,values)
              print(json.dumps({'limit_stage':'after','names':names.get(name),
                    'applied':resource.getrlimit(name)}),flush=True)
          def traced_exec(*args):
              print(json.dumps({'worker_stage':'before_exec'}),flush=True)
              return original_exec(*args)
          resource.setrlimit=traced_limit
          os.execvpe=traced_exec
          main(sys.argv[1:])
          '''
          
          
          def exception_chain(error):
              result, seen = [], set()
              while error is not None and id(error) not in seen and len(result) < 8:
                  seen.add(id(error))
                  result.append({"type": type(error).__name__, "message": str(error)[:1500]})
                  error = error.__cause__ or error.__context__
              return result
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--output', type=Path, default=os.environ.get('DIAGNOSTIC_OUTPUT'))
              options = parser.parse_args()
              repo = Path.cwd().resolve()
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
              if (head, tree) != (EXPECTED_COMMIT, EXPECTED_TREE):
                  raise RuntimeError('Exact reviewed source and tree required')
              if options.output is None:
                  parser.error('Explicit output outside the product checkout required')
              output = options.output.resolve()
              if output.is_relative_to(repo):
                  raise RuntimeError('Output must be outside the product checkout')
              output.mkdir(parents=True, exist_ok=False)
              private = output / 'private-parent-data'
              os.environ.update(DATA_DIR=str(private), DATABASE_URL='sqlite:///:memory:',
                  SECRET_KEY_FILE=str(private / 'keyring.json'), INTEGRATION_STATE_FILE=str(private / 'integrations.json'),
                  JOB_SCHEDULER_ENABLED='false', BACKUP_SCHEDULE_ENABLED='false', ENVIRONMENT='development')
              sys.path.insert(0, str(repo))
              from PIL import Image
              from reportlab.pdfgen.canvas import Canvas
          
              from backend.services import ai_document_images, assistant, document_text_process
              from backend.services.document_text_reader import Budget
              from backend.services.e_invoice import validator
          
              versions = {}
              for name in ('psutil', 'pypdf', 'pillow', 'PySide6', 'PySide6_Addons', 'PySide6_Essentials',
                           'shiboken6', 'reportlab', 'fastapi', 'pydantic'):
                  try:
                      versions[name] = importlib.metadata.version(name)
                  except importlib.metadata.PackageNotFoundError:
                      versions[name] = None
              record = {'schema': 'immomanager-final-document-diagnostics/1', 'source_commit': head, 'source_tree': tree,
                  'platform': sys.platform, 'machine': platform.machine(), 'python': sys.version, 'packages': versions,
                  'status': 'running', 'budgets_changed': False, 'provider_calls_performed_by_script': False,
                  'provider_call_field_is_declared_not_an_instrumented_counter': True,
                  'cases': [], 'calls': [], 'processes': [], 'budget_events': []}
              phase = ['setup']
              original_run, original_factory = validator._run, validator.CliProcess
              budget_module, original_budget = None, None
          
              def persist():
                  (output / 'diagnostics.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          
              def own_snapshot(process):
                  item = {'pid': process.pid, 'popen_returncode': process.poll()}
                  try:
                      import psutil
                      own = psutil.Process(process.pid)
                      item.update(ppid=own.ppid(), expected_ppid=os.getpid(), create_time=own.create_time(),
                                  rss_bytes=own.memory_info().rss, running=own.is_running())
                      if os.name != 'nt':
                          item['pgid'] = os.getpgid(process.pid)
                          item['expected_pgid'] = process.pid
                  except Exception as error:
                      item['measurement_exception_chain'] = exception_chain(error)
                  return item
          
              def capture(entry, value):
                  if value is None or value[0] not in ('stdout', 'stderr'):
                      return
                  channel, line = value
                  destination = entry[channel]
                  raw = line.encode('utf-8', 'replace')
                  used = len(destination['text'].encode('utf-8'))
                  destination['text'] += raw[:max(0, CAPTURE_BYTES - used)].decode('utf-8', 'replace')
                  destination['bytes_total'] += len(raw)
                  destination['truncated'] = destination['bytes_total'] > CAPTURE_BYTES
          
              def factory(argv, profile, **kwargs):
                  if not Path(profile).name.startswith('immo-e-invoice-text-'):
                      raise RuntimeError('Only this synthetic document worker may be observed')
                  actual = list(argv)
                  if actual[1:3] == ['-m', 'backend.services.e_invoice.posix_worker']:
                      actual = [actual[0], '-c', LIMIT_TRACE, *actual[3:]]
                  entry = {'phase': phase[0], 'original_argv': list(argv), 'actual_argv': actual,
                      'memory_limit_bytes': kwargs.get('memory_limit_bytes'), 'max_processes': kwargs.get('max_processes', 2),
                      'stdout': {'text': '', 'bytes_total': 0, 'truncated': False},
                      'stderr': {'text': '', 'bytes_total': 0, 'truncated': False}}
                  record['processes'].append(entry)
                  try:
                      child = original_factory(actual, profile, **kwargs)
                  except BaseException as error:
                      entry['start_exception_chain'] = exception_chain(error)
                      persist()
                      raise
                  entry['initial_own_snapshot'] = own_snapshot(child.process)
          
                  class Spy:
                      def __getattr__(self, name):
                          return getattr(child, name)
          
                      def __enter__(self):
                          child.__enter__()
                          return self
          
                      def next_line(self, timeout=.2):
                          value = child.next_line(timeout)
                          capture(entry, value)
                          persist()
                          return value
          
                      def __exit__(self, *args):
                          try:
                              return child.__exit__(*args)
                          finally:
                              # Init/gate failures can happen before _run consumes any
                              # lines. Drain only the already bounded owned-child queue.
                              while True:
                                  try:
                                      capture(entry, child.lines.get_nowait())
                                  except queue.Empty:
                                      break
                              entry['exit_code_after_owned_cleanup'] = child.process.poll()
                              persist()
                  persist()
                  return Spy()
          
              def run(argv, profile, **kwargs):
                  environment = kwargs.get('environment', {})
                  entry = {'phase': phase[0], 'resource_mode': kwargs.get('resource_mode'),
                      'timeout_seconds': kwargs.get('timeout_seconds'), 'max_processes': kwargs.get('max_processes'),
                      'file_limit_bytes': kwargs.get('file_limit_bytes'),
                      'private_environment': {'path_empty': environment.get('PATH') == '',
                          'qt_override_absent': not any(k.startswith('QT_') for k in environment),
                          'provider_secret_names_absent': not any(k in environment for k in
                              ('OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'GH_TOKEN', 'GITHUB_TOKEN', 'ACTIONS_RUNTIME_TOKEN'))}}
                  record['calls'].append(entry)
                  start = time.monotonic()
                  try:
                      result = original_run(argv, profile, **kwargs)
                      entry['exit_code'] = result[0]
                      return result
                  except BaseException as error:
                      entry['exception_chain'] = exception_chain(error)
                      raise
                  finally:
                      entry['seconds'] = round(time.monotonic() - start, 3)
                      persist()
          
              def budget_event(stage, instance, error=None):
                  item = {'phase': phase[0], 'stage': stage, 'pid': getattr(instance, 'pid', None),
                          'known_owned_identity_count': len(getattr(instance, 'known', {}))}
                  if error is not None:
                      item['exception_chain'] = exception_chain(error)
                  record['budget_events'].append(item)
                  persist()
          
              validator._run, validator.CliProcess = run, factory
              try:
                  if os.name != 'nt':
                      from backend.services.e_invoice import image_budget as budget_module
                      original_budget = budget_module.ImageBudget
          
                      class TracedBudget(original_budget):
                          def __init__(self, *args, **kwargs):
                              budget_event('before_init', self)
                              try:
                                  super().__init__(*args, **kwargs)
                              except BaseException as error:
                                  budget_event('init_failure', self, error)
                                  raise
                              budget_event('after_init', self)
          
                          def check(self):
                              try:
                                  return super().check()
                              except BaseException as error:
                                  budget_event('check_failure', self, error)
                                  raise
          
                          def release(self, profile):
                              try:
                                  result = super().release(profile)
                              except BaseException as error:
                                  budget_event('release_failure', self, error)
                                  raise
                              budget_event('after_release', self)
                              return result
                      budget_module.ImageBudget = TracedBudget
          
                  png = BytesIO()
                  Image.new('RGB', (8, 4), (20, 110, 100)).save(png, 'PNG')
                  pdf = BytesIO()
                  canvas = Canvas(pdf, pagesize=(144, 72), invariant=1)
                  canvas.drawString(8, 36, 'LOCAL AI WORKER')
                  canvas.showPage()
                  canvas.save()
                  docx = BytesIO()
                  with zipfile.ZipFile(docx, 'w', zipfile.ZIP_DEFLATED) as package:
                      package.writestr('[Content_Types].xml', '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')
                      package.writestr('_rels/.rels', '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="document" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')
                      package.writestr('word/document.xml', '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>LOCAL AI WORKER DOCX</w:t></w:r></w:p></w:body></w:document>')
                  pdf_raw, png_raw, docx_raw = pdf.getvalue(), png.getvalue(), docx.getvalue()
                  record['fixtures'] = {name: {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
                      for name, raw in [('pdf', pdf_raw), ('png', png_raw), ('docx', docx_raw)]}
                  cases = [
                      ('read_plain', lambda: asdict(document_text_process.read_isolated(b'LOCAL AI WORKER', 'probe.txt', {}, Budget()))),
                      ('read_pdf', lambda: asdict(document_text_process.read_isolated(pdf_raw, 'probe.pdf', {}, Budget()))),
                      ('image_png', lambda: ai_document_images.render_page_images(png_raw, 'image/png', 'probe.png', 1)),
                      ('image_pdf', lambda: ai_document_images.render_page_images(pdf_raw, 'application/pdf', 'probe.pdf', 1)),
                      ('attachment_pdf', lambda: assistant.inspect_attachment(pdf_raw, 'probe.pdf')),
                      ('attachment_png', lambda: assistant.inspect_attachment(png_raw, 'probe.png')),
                      ('attachment_docx', lambda: assistant.inspect_attachment(docx_raw, 'probe.docx')),
                  ]
                  for name, operation in cases:
                      phase[0] = name
                      item = {'name': name}
                      try:
                          result = operation()
                          # Source text is exclusively the bounded synthetic fixture.
                          item.update(status='returned', result={k: v for k, v in result.items() if k != 'images'})
                          if 'images' in result:
                              item['result']['image_count'] = len(result['images'])
                      except BaseException as error:
                          item.update(status='raised', exception_chain=exception_chain(error))
                      record['cases'].append(item)
                      persist()
                  record['status'] = 'diagnosis_complete_not_a_product_acceptance'
              finally:
                  validator._run, validator.CliProcess = original_run, original_factory
                  if budget_module is not None and original_budget is not None:
                      budget_module.ImageBudget = original_budget
                  persist()
              print(json.dumps({'output': str(output / 'diagnostics.json'), 'cases': len(record['cases']),
                                'status': record['status']}))
          
          
          if __name__ == '__main__':
              main()
          PY
      - name: Preserve only the bounded diagnostic JSON, never private runtime data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AI-document-final-diagnostics-${{ matrix.id }}
          path: ${{ runner.temp }}/ai-document-final-diag-${{ matrix.id }}/diagnostics.json
          if-no-files-found: error
          retention-days: 7
