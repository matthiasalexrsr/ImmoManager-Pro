version: "3.9"

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      # Hosting is explicit and fail-closed: the entrypoint checks these settings
      # (tools/validate_hosting_config.py) before migrating or starting anything.
      # Local development uses docker-compose.development.yml on top.
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-immo}:${POSTGRES_PASSWORD:?Set a unique URL-safe PostgreSQL password}@db:5432/${POSTGRES_DB:-immomanager}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set a unique strong signing secret}
      # The proxy's address as the container sees it (e.g. the Docker bridge gateway);
      # only from there are X-Forwarded-For and X-Forwarded-Proto believed.
      - FORWARDED_ALLOW_IPS=${TRUSTED_PROXY_IPS:-}
      - ALLOW_INMEMORY_FALLBACK=false
      - AUTO_SEED_DEMO_DATA=false
      - DIAGNOSTICS_ALLOW_IN_PRODUCTION=false
      - UPDATE_ALLOW_IN_PRODUCTION=false
      - IMMO_TESTVERSION=false
      - ALLOW_SELF_REGISTRATION=false
      - SECURITY_HEADERS_ENABLED=true
      - PORTAL_ENABLED=${PORTAL_ENABLED:-false}
      - PORTAL_PUBLIC_URL=${PORTAL_PUBLIC_URL:-}
      - PORTAL_LOCAL_TEST_MODE=false
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # The public HTTPS origin(s) of this instance, e.g. https://verwaltung.example.de
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Schema changes: the entrypoint runs `python -m backend.upgrade` (full backup first).
      # Full backups: daily at 01:30 Europe/Berlin into /app/data/backups/full; optional second target
      # (mount it, e.g. a network share) and passphrase for the archived keys.
      - BACKUP_SECOND_TARGET=${BACKUP_SECOND_TARGET:-}
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:-}
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-immo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set a unique URL-safe PostgreSQL password}
      - POSTGRES_DB=${POSTGRES_DB:-immomanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immo} -d ${POSTGRES_DB:-immomanager}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
