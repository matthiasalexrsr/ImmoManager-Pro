[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mietvertrag-wizard"
version = "0.2.2"
description = "Browserbasierter Mietvertrag-Wizard als Python-Integration (serverseitiges PDF via ReportLab)"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100",
  "jinja2>=3.1",
  "reportlab>=4.0",
]
