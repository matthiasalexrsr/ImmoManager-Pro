[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immomanager-pro"
version = "2.0.0-beta.1"
description = "ImmoManager Pro – Immobilienverwaltung für Mietobjekte"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
postgres = ["psycopg2-binary==2.9.13"]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.1.0",
]
ai = [
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.23.0",
    "faiss-cpu>=1.8.0",
    "torch>=2.2.0",
]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]

[project.scripts]
immomanager = "backend.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-runtime.txt"]}

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["assets/fonts/*", "resources/tessdata/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
omit = [
    "backend/__main__.py",
    "backend/updater.py",
    "backend/services/autotest/*",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
[[tool.mypy.overrides]]
module = "backend.domain.*"
disallow_untyped_defs = true
