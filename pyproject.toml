[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immomanager-pro"
version = "1.0.0"
description = "ImmoManager Pro – Immobilienverwaltung für Mietobjekte"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "aiosqlite>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "cffi>=1.15.0",
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.1.0",
]
ai = [
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.23.0",
    "faiss-cpu>=1.8.0",
    "torch>=2.2.0",
]
build = ["pyinstaller>=6.0.0"]

[project.scripts]
immomanager = "backend.__main__:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
omit = [
    "backend/__main__.py",
    "backend/updater.py",
    "backend/services/autotest/*",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "misc",
    "operator",
    "return-value",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = "backend.domain.*"
disallow_untyped_defs = true
