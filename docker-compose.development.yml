# Explicit local development only; the base file otherwise selects production.
# Both files keep the application bound to loopback on the Docker host.
#   docker compose -f docker-compose.yml -f docker-compose.development.yml up
services:
  app:
    environment:
      - ENVIRONMENT=development
      - FORWARDED_ALLOW_IPS=127.0.0.1
      - CORS_ORIGINS=http://127.0.0.1:${APP_PORT:-8000},http://localhost:${APP_PORT:-8000},http://localhost:5173
      - PORTAL_ENABLED=false
      - PORTAL_PUBLIC_URL=
      - PORTAL_LOCAL_TEST_MODE=false
